<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | SOC Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1a2e;color:#e8eef7;font:14px 'Plus Jakarta Sans',system-ui,sans-serif}
form{width:min(340px,92vw);background:#1b2a40;border:1px solid #2a3b55;border-radius:14px;padding:26px}h1{font-size:20px;margin:0 0 4px}p{color:#8a9bb4;margin:0 0 18px}
label{display:block;font-size:12px;color:#8a9bb4;margin:12px 0 5px}input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3b55;background:#142238;color:#e8eef7;font:inherit}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:#ff7a1a;color:#fff;font:600 14px inherit;cursor:pointer}#e{color:#ff7a7a;font-size:13px;min-height:18px;margin-top:10px}input:focus-visible,button:focus-visible{outline:2px solid #fff}</style></head>
<body><form id="f"><h1>Security Operations Center</h1><p>Sign in to continue</p>
<label for="u">Username</label><input id="u" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<div id="e" role="alert"></div><button>Sign in</button></form>
<script>document.getElementById('f').onsubmit=function(ev){ev.preventDefault();fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}).then(function(r){return r.json().then(function(j){if(r.ok)location='/';else e.textContent=j.error})})}</script></body></html>
