
services:
  soc-dashboard:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your .env file}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in your .env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env file}

    volumes:
      - soc-data:/app/data

    restart: unless-stopped

volumes:
  soc-data:
