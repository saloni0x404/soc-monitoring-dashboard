services:
  soc-dashboard:
    build: .
    ports: ["3000:3000"]
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-long-random-string}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - soc-data:/app/data
    restart: unless-stopped
volumes:
  soc-data:
